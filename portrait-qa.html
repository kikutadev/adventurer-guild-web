<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adventurer Portrait QA</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:24px;background:#f2ede3;color:#29251f}h1{font-size:24px}p{color:#665f54}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}.card{background:#fffaf0;border:1px solid #c9bda9;border-radius:12px;padding:14px}.name{font-weight:700;margin-bottom:10px}.samples{display:flex;align-items:end;gap:14px}.p100{width:100px;height:100px;image-rendering:pixelated;border-radius:8px}.p40{width:40px;height:40px;image-rendering:pixelated;border-radius:5px}.role{font-size:12px;color:#786e61;margin-top:8px}</style></head><body><h1>Named Adventurer Portrait QA</h1><p>100×100 character card / 40×40 party chip visual check</p><div class="grid" id="g"></div><script>
const rows=[['Brann','Warrior','brann.png'],['Kael','Warrior','kael.png'],['Tessa','Warrior','tessa.png'],['Lune','Scout','lune.png'],['Rook','Scout','rook.png'],['Nia','Scout','nia.png'],['Elio','Mage','elio.png'],['Selene','Mage','selene.png'],['Orin','Mage','orin.png'],['Faye','Support candidate','faye.png']];
const g=document.querySelector('#g');for(const [n,r,f] of rows){g.insertAdjacentHTML('beforeend',`<div class="card"><div class="name">${n}</div><div class="samples"><img class="p100" src="/assets/characters/generated/${f}"><img class="p40" src="/assets/characters/generated/${f}"></div><div class="role">${r}</div></div>`)}
</script></body></html>
